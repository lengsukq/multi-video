name: Windows SDK native media smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-video-effects-smoke.yml'
      - 'packages/flutter_realtime_processed_video/**'
      - 'packages/flutter_realtime_video_effects/**'
      - 'packages/flutter_realtime_media_livekit/**'
      - 'packages/flutter_realtime_media_agora/**'
      - 'packages/flutter_realtime_media_trtc/**'
      - 'packages/flutter_webrtc/windows/**'
      - 'example/**'
  pull_request:
    paths:
      - '.github/workflows/windows-video-effects-smoke.yml'
      - 'packages/flutter_realtime_processed_video/**'
      - 'packages/flutter_realtime_video_effects/**'
      - 'packages/flutter_realtime_media_livekit/**'
      - 'packages/flutter_realtime_media_agora/**'
      - 'packages/flutter_realtime_media_trtc/**'
      - 'packages/flutter_webrtc/windows/**'
      - 'example/**'

permissions:
  contents: read

jobs:
  native-portable-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable Windows video pipeline tests (MSVC x64)
        run: cmake -S packages/flutter_realtime_processed_video/windows/test -B build/windows-native-tests -A x64
      - name: Compile native tests
        run: cmake --build build/windows-native-tests --config Debug --parallel
      - name: Verify color conversion, blur, frame hub, I420
        run: ctest --test-dir build/windows-native-tests -C Debug --output-on-failure

  native-plugin-link:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter Windows setup
        run: flutter config --enable-windows-desktop
      - name: Report toolchain
        run: flutter doctor -v
      - name: Resolve SDK development Demo with local Windows plugins
        working-directory: example
        run: flutter pub get
      - name: Build Windows Release (links ONNX Runtime, LiveKit, Agora, TRTC)
        working-directory: example
        run: flutter build windows --release --no-pub
      - name: Verify bundled model and runtime assets
        shell: pwsh
        run: |
          $runner = 'example/build/windows/x64/runner/Release'
          if (-not (Test-Path "$runner/multi-video.exe")) { throw 'Windows runner not found' }
          if (-not (Test-Path "$runner/onnxruntime.dll")) { throw 'ONNX Runtime DLL missing' }
          $assets = "$runner/data/flutter_assets/packages/flutter_realtime_video_effects/assets/windows/pphumanseg.onnx"
          if (-not (Test-Path $assets)) { throw 'PPHumanSeg model asset missing' }
      - name: Collect native build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-logs
          path: |
            example/build/windows/x64/**/CMakeFiles/CMakeConfigureLog.yaml
            example/build/windows/x64/**/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  aggregate-sdk-link:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Assemble the public single-package SDK from the current source
        run: python scripts/assemble_single_sdk_distribution.py
      - name: Create a fresh external Windows host
        run: flutter create --platforms=windows --project-name sdk_windows_smoke build/windows_sdk_smoke
      - name: Use the assembled one-package SDK without internal path dependencies
        shell: pwsh
        run: |
          $spec = 'build/windows_sdk_smoke/pubspec.yaml'
          $raw = Get-Content $spec -Raw
          $raw = $raw.Replace('dependencies:', "dependencies:`n  flutter_realtime_sdk:`n    path: ../single_sdk_candidate")
          Set-Content -Path $spec -Value $raw
      - name: Resolve the external host dependencies
        working-directory: build/windows_sdk_smoke
        run: flutter pub get
      - name: Link the assembled SDK in Windows Release configuration
        working-directory: build/windows_sdk_smoke
        run: flutter build windows --release --no-pub
      - name: Verify SDK DLL, ONNX runtime and bundled model
        shell: pwsh
        run: |
          $runner = 'build/windows_sdk_smoke/build/windows/x64/runner/Release'
          if (-not (Test-Path "$runner/sdk_windows_smoke.exe")) { throw 'External Windows host missing' }
          if (-not (Test-Path "$runner/flutter_realtime_sdk_plugin.dll")) { throw 'Aggregated SDK plugin missing' }
          if (-not (Test-Path "$runner/onnxruntime.dll")) { throw 'ONNX Runtime missing' }
          $model = "$runner/data/flutter_assets/packages/flutter_realtime_sdk/assets/bundled/flutter_realtime_video_effects/windows/pphumanseg.onnx"
          if (-not (Test-Path $model)) { throw 'Bundled Windows model missing' }
