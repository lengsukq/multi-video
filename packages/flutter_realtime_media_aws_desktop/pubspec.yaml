name: flutter_realtime_media_aws_desktop
description: Internal macOS WebKit transport and experimental Windows WebView2 media runtime for AWS.
version: 0.1.0
publish_to: 'none'
repository: https://github.com/lengsukq/multi-video
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  webview_flutter_windows: ^1.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  assets:
    - assets/windows_runtime.js
    - assets/windows_host.js
  plugin:
    platforms:
      macos:
        pluginClass: FlutterRealtimeMediaAwsDesktopPlugin
