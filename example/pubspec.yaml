name: multi_video
description: multi-video, a cross-platform multi-provider meeting, livestream and chat demo.
version: 1.0.0+1
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.47.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter_realtime_video_effects:
    path: ../packages/flutter_realtime_video_effects
  flutter_realtime_shared_content_preset:
    path: ../packages/flutter_realtime_shared_content_preset
  flutter_realtime_screen_annotation:
    path: ../packages/flutter_realtime_screen_annotation
  flutter:
    sdk: flutter
  flutter_realtime_sdk:
    path: ../packages/flutter_realtime_sdk
  flutter_realtime_classroom_preset:
    path: ../packages/flutter_realtime_classroom_preset
  flutter_realtime_live_preset:
    path: ../packages/flutter_realtime_live_preset
  flutter_realtime_sdk_ui:
    path: ../packages/flutter_realtime_sdk_ui
  # Optional providers registered explicitly by this UI-composition Demo.
  flutter_realtime_provider_livekit:
    path: ../packages/flutter_realtime_provider_livekit
  flutter_realtime_provider_agora:
    path: ../packages/flutter_realtime_provider_agora
  flutter_realtime_provider_trtc:
    path: ../packages/flutter_realtime_provider_trtc
  flutter_realtime_provider_artc:
    path: ../packages/flutter_realtime_provider_artc
  flutter_realtime_provider_aws:
    path: ../packages/flutter_realtime_provider_aws
  flutter_realtime_provider_agora_chat:
    path: ../packages/flutter_realtime_provider_agora_chat
  flutter_realtime_provider_ivs_chat:
    path: ../packages/flutter_realtime_provider_ivs_chat
  flutter_realtime_provider_tencent_chat:
    path: ../packages/flutter_realtime_provider_tencent_chat

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_realtime_media_core:
    path: ../packages/flutter_realtime_media_core
  # Provider-specific imports are intentionally limited to low-level E2E
  # adapter tests. The demo application itself only consumes
  # flutter_realtime_sdk.
  flutter_realtime_media_agora:
    path: ../packages/flutter_realtime_media_agora
  flutter_realtime_media_artc:
    path: ../packages/flutter_realtime_media_artc
  flutter_realtime_media_chime:
    path: ../packages/flutter_realtime_media_chime
  flutter_realtime_chat_agora:
    path: ../packages/flutter_realtime_chat_agora
  flutter_realtime_media_ivs:
    path: ../packages/flutter_realtime_media_ivs
  flutter_realtime_media_aws_desktop:
    path: ../packages/flutter_realtime_media_aws_desktop
  flutter_realtime_media_livekit:
    path: ../packages/flutter_realtime_media_livekit
  flutter_realtime_media_trtc:
    path: ../packages/flutter_realtime_media_trtc

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

dependency_overrides:
  # Keep the macOS renderer lifetime fix in sync with the demo app.
  flutter_webrtc:
    path: ../packages/flutter_webrtc

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  config:
    # Enable SwiftPM by default for iOS (IVS Media/Chat require it).
    # Flutter's toggle is app-wide, not per-platform. macOS uses the
    # CocoaPods launch/build wrappers in scripts/, which disable it per run.
    enable-swift-package-manager: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/backgrounds/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
